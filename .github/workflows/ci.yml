name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # README checks use this repository's native CLI pin.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.5
          install_args: --locked

      - run: pnpm install --frozen-lockfile

      - run: pnpm run --if-present lint

      - run: pnpm run --if-present format:check

      - run: pnpm run --if-present typecheck

      - run: pnpm run --if-present build

      # Immutable Git consumers use the committed build.
      - run: pnpm check:dist

      - run: pnpm run --if-present test

      # README is generated by mdtheme from README.md.src.
      - run: pnpm readme:check

      # This package must work after installation, not just from workspace sources.
      - run: pnpm verify:package
